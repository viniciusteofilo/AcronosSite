name: Deploy

# Manual deploy to Cloudflare Workers. Everything it needs comes from repository secrets
# (Settings → Secrets and variables → Actions). See docs/DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Public address (e.g. https://acronos-site.<account>.workers.dev or https://acronos.com.br)"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ inputs.site_url }}
      NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}
      BETTER_AUTH_URL: ${{ inputs.site_url }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check required secrets
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEON_DATABASE_URL BETTER_AUTH_SECRET CRON_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing repository secrets:$missing"; exit 1; }
          [ ${#CRON_SECRET} -ge 32 ] || { echo "::error::CRON_SECRET must have at least 32 characters"; exit 1; }

      - name: Backup before migrating
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # pg_dump must be at least as new as the server: use the PostgreSQL project's client 17
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          scripts/backup.sh backups
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30

      - name: Apply database migrations (Neon)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:migrate

      - name: Create R2 buckets and Hyperdrive if missing
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node scripts/cloudflare-resources.mjs

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Upload Worker secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
        run: |
          node -e 'const k=["BETTER_AUTH_SECRET","CRON_SECRET","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","PAYPAL_CLIENT_ID","PAYPAL_CLIENT_SECRET","PAYPAL_WEBHOOK_ID"];const o={};for(const x of k)if(process.env[x])o[x]=process.env[x];require("fs").writeFileSync("/tmp/secrets.json",JSON.stringify(o))'
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Deploy
        run: npx opennextjs-cloudflare deploy

      - name: Smoke test
        run: |
          sleep 10
          for path in / /shop /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL$path")
            echo "$path → $code"
            [ "$code" = "200" ] || exit 1
          done
