name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acronos
          POSTGRES_PASSWORD: acronos_ci
          POSTGRES_DB: acronos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acronos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://acronos:acronos_ci@localhost:5432/acronos_test
      TEST_DATABASE_URL: postgres://acronos:acronos_ci@localhost:5432/acronos_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-123
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests (real PostgreSQL)
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start stripe-mock (local Stripe API simulator for checkout tests)
        run: |
          curl -sSL https://github.com/stripe/stripe-mock/releases/download/v0.197.0/stripe-mock_0.197.0_linux_amd64.tar.gz | tar xz -C /tmp
          /tmp/stripe-mock -http-port 12111 -https-port 12112 &
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Cloudflare Workers bundle (build only, no deploy)
        run: |
          npx opennextjs-cloudflare build # needs DATABASE_URL only for prerendering
          npx wrangler deploy --dry-run --outdir /tmp/cf | tee /tmp/cf.log
          kib=$(grep -o 'gzip: [0-9.]*' /tmp/cf.log | grep -o '[0-9.]*' | cut -d. -f1)
          echo "Worker size (gzip): ${kib} KiB (Workers Paid limit 10240 KiB)"
          [ "$kib" -lt 10240 ]
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Known vulnerabilities in production dependencies
        run: node scripts/audit.mjs
